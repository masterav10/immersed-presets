plugins {
	id 'javacpp-plugin'
}

ext {
	nativeLibHome = "${buildDir}/unpacked/dist"

	vcPlatform = "x64"
	vcConfig = "Release"
	libcorrectVersion = "1.0.0"
	
	libcorrectHome="${nativeLibHome}/libcorrect-${libcorrectVersion}"
}

version "$libcorrectVersion-$javacppPresetVersion"

repositories {    
    ivy {
    	url 'https://github.com/'
    	
        patternLayout {
           	// masterav10/libcorrect/archive/refs/tags/v1.0.0.zip
	        artifact '/[organisation]/[module]/archive/refs/tags/v[revision].[ext]'
        }
        
        // This is required in Gradle 6.0+ as metadata file (ivy.xml) 
        // is mandatory. Docs linked below this code section
        metadataSources { artifact() } 
    }
}

configurations {
	zip
}

dependencies {
    api "org.bytedeco:javacpp:$javacppVersion"
    implementation "org.bytedeco:javacpp:$javacppVersion:$javacppPlatform"
	
	api "org.bytedeco:systems:$javacppPresetVersion"
	runtimeOnly "org.bytedeco:systems:$javacppPresetVersion:$javacppPlatform"
	
	zip "masterav10:libcorrect:${libcorrectVersion}@zip"
}

task unzipLibcorrect(type: Copy) {
	def zipPath = project.configurations.zip.find {it.name.startsWith("libcorrect") }
	def zipFile = file(zipPath)
	def outputDir = file("${nativeLibHome}")
	
	from zipTree(zipFile)
	into outputDir
	
	doLast {
		mkdir "${libcorrectHome}/build"
	}
}

task generateLibcorrectProjects(type:Exec, dependsOn: unzipLibcorrect) {
	workingDir "${libcorrectHome}/build"
	
	commandLine "cmake", ".."
}

task compileLibcorrect(type:Exec, dependsOn: generateLibcorrectProjects) {
	workingDir "${libcorrectHome}/build"

	commandLine "msbuild",
				"Correct.sln",
				"-t:correct_static",
				"-p:Configuration=${vcConfig}",
				"-p:Platform=${vcPlatform}"
}

javacppGenerate.dependsOn 'compileLibcorrect'

javacppGenerate {
	systemProperties['libcorrect.src'] = "${libcorrectHome}/include"
	systemProperties['libcorrect.bin'] = "${libcorrectHome}/build/lib/Release"
	
	debug = false
}

javacppJniGenerate {
	debug = false

	doFirst {
		args "-nodelete"
	}
}